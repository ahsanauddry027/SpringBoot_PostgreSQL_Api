# The application's name, shown in the logs.
spring.application.name=studentapi

# Read extra settings from a file named .env in the project folder.
# "optional:" = don't crash if the file is missing.
# "[.properties]" = read it as key=value lines, like this file.
spring.config.import=optional:file:.env[.properties]

# Server configuration: the port is the last four digits of the student ID.
server.port=1027

# PostgreSQL connection
spring.datasource.url=jdbc:postgresql://localhost:5432/student_db
spring.datasource.username=postgres
# ${DB_PASSWORD} is filled in from the .env file, so the real password is never in this file.
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate configuration
# update = create or alter tables to match the @Entity classes at startup.
spring.jpa.hibernate.ddl-auto=update
# Print each SQL statement in the console, nicely formatted.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Close the database connection when the service method ends, not when the response is sent.
spring.jpa.open-in-view=false

# Errors come back as JSON with a readable message.
spring.mvc.problemdetails.enabled=true
server.error.include-message=always

# Document upload: the largest file allowed, and the folder files are saved in.
spring.servlet.multipart.max-file-size=3MB
kaaj.files.dir=./data/uploads